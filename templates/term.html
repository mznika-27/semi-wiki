<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}｜半導體產業小百科</title>
<meta name="description" content="{{ONELINER}}">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="topbar"><div class="inner">
  <a class="brand" href="../index.html">半導體<span>小百科</span></a>
  <span class="sub">一個名詞一頁・白話版</span>
</div></header>

<main class="wrap term" data-slug="{{SLUG}}">
  <div class="crumb"><a href="../index.html">首頁</a> › {{CATEGORY_LABEL}}</div>
  <div class="term-head">
    <span class="tag cat-{{CATEGORY}}">{{CATEGORY_LABEL}}</span>
    <h1>{{NAME}}</h1>
    <div class="en">{{EN}}</div>
  </div>
  <div class="oneliner">{{ONELINER}}</div>

  <section id="what">
    <h2>白話解釋</h2>
    <!-- 2 到 4 段 <p>，先講它在做什麼，再講為什麼重要 -->
  </section>

  <section id="chain">
    <h2>在供應鏈的位置</h2>
    <div class="chain">
      <div class="node"><b>上游</b>（誰提供它需要的東西）</div><span class="arrow">→</span>
      <div class="node me"><b>本詞條</b>{{NAME}}</div><span class="arrow">→</span>
      <div class="node"><b>下游</b>（誰用它）</div>
    </div>
  </section>

  <section id="companies">
    <h2>相關公司</h2>
    <table class="co">
      <tr><th>公司</th><th>角色</th></tr>
      <!-- 只放公開、確定的角色，不寫股價、目標價、買賣建議 -->
    </table>
  </section>

  <section id="myth">
    <h2>常見誤解</h2>
    <!-- 1 到 2 條 <p>，寫剛接觸這個名詞的人最容易搞錯的地方 -->
  </section>

  <section id="related">
    <h2>相關詞條</h2>
    <div class="related">
      <!-- <a href="slug.html">名稱<small>一句話說明</small></a>，連結的詞條必須存在 -->
    </div>
  </section>

  <p class="meta">更新日期：{{UPDATED}}・資料來源：公開資料整理，不構成投資建議</p>
</main>
<footer><a href="../index.html">← 回首頁</a></footer>
</body>
</html>
