<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}｜AI 供應鏈技術筆記</title>
<meta name="description" content="{{ONELINER}}">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="topbar"><div class="inner">
  <a class="brand" href="../index.html">AI 供應鏈<span>技術筆記</span></a>
  <span class="sub">一個技術一頁・研究用</span>
</div></header>

<main class="wrap term" data-slug="{{SLUG}}">
  <div class="crumb"><a href="../index.html">首頁</a> › {{CATEGORY_LABEL}}</div>
  <div class="term-head">
    <span class="tag cat-{{CATEGORY}}">{{CATEGORY_LABEL}}</span>
    <h1>{{NAME}}</h1>
    <div class="en">{{EN}}</div>
  </div>
  <div class="oneliner">{{ONELINER}}</div>

  <section id="what">
    <h2>技術重點</h2>
    <!-- 2 到 3 段 <p>：它解決什麼瓶頸、怎麼做到、目前到哪個世代 -->
  </section>

  <section id="compare">
    <h2>跟舊做法差在哪</h2>
    <table class="cmp">
      <tr><th>比較項目</th><th>舊做法</th><th>新做法</th></tr>
      <!-- 2 到 4 列，每格一句話 -->
    </table>
  </section>

  <section id="chain">
    <h2>在供應鏈的位置</h2>
    <div class="chain">
      <div class="node"><b>上游</b>（誰提供它需要的東西）</div><span class="arrow">→</span>
      <div class="node me"><b>本詞條</b>{{NAME}}</div><span class="arrow">→</span>
      <div class="node"><b>下游</b>（誰用它）</div>
    </div>
  </section>

  <section id="companies">
    <h2>相關公司</h2>
    <table class="co">
      <tr><th>公司</th><th>角色</th></tr>
      <!-- 只放公開、確定的角色，不寫股價、目標價、買賣建議 -->
    </table>
  </section>

  <section id="watch">
    <h2>研究時看什麼</h2>
    <ul>
      <!-- 2 到 4 條 <li>：導入時程、良率或產能瓶頸、規格往哪走、誰的 content 會變多 -->
    </ul>
  </section>

  <section id="related">
    <h2>相關詞條</h2>
    <div class="related">
      <!-- <a href="slug.html">名稱<small>一句話說明</small></a>，連結的詞條必須存在 -->
    </div>
  </section>

  <p class="meta">更新日期：{{UPDATED}}・資料來源：公開資料整理，不構成投資建議</p>
</main>
<footer><a href="../index.html">← 回首頁</a></footer>
</body>
</html>
